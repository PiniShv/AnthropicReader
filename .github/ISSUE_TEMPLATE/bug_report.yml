name: Bug report
description: Something does not load, looks wrong or breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never upload real export data.** A Claude export contains other people's names, emails, phone numbers and private conversations.
        > Do not attach export files, and do not paste screenshots, logs or JSON that show real names or text.
        > Reproduce the bug with the sample data ("Try it with sample data", or `npm run demo`) or with a small made-up example.
        > If you can only show it with real data, describe the shape of the data in words (file, keys, types).

        Security problems: please report them privately instead. See [SECURITY.md](https://github.com/PiniShv/AnthropicReader/blob/main/SECURITY.md).

  - type: checkboxes
    id: no-real-data
    attributes:
      label: Data check
      options:
        - label: This report contains no real export data (no real names, emails, ids or conversation text, also not in screenshots).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? Include the exact error message if there is one.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally with the sample data, so anyone can follow them.
      placeholder: |
        1. Open dist/claude-export-reader.html
        2. Click "Try it with sample data"
        3. Open …
        4. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: checkboxes
    id: parts
    attributes:
      label: Which export parts did you load?
      options:
        - label: sample data only
        - label: conversations-000.zip
        - label: light_metadata-000.zip (users.json)
        - label: projects-000.zip
        - label: memories-000.zip
        - label: design_chats-000.zip
        - label: frames-*.zip (artifacts)
        - label: manifest-….json
        - label: an older export (projects.json, memories.json or a plain folder)

  - type: input
    id: version
    attributes:
      label: Reader version
      description: Shown at the bottom of the start page ("Claude Export Reader v…"), or the commit you built from.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 143, Safari 26, …
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Ubuntu 24.04, iOS 26, …

  - type: textarea
    id: console
    attributes:
      label: Browser console output (optional)
      description: Open the developer tools (F12), copy errors from the Console tab, and **remove any personal data** before pasting.
      render: text
