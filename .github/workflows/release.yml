name: Release

# Runs when a version tag such as v1.2.3 is pushed. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags:
      - 'v*.*.*'

# No token rights by default. Only the release job gets write access.
permissions: {}

# Never run two releases of one tag at once, and never stop one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, for the check below

      # A tag can point to any commit, also one that nobody reviewed. So publish only
      # commits that are on main, and check it before any code of the commit runs here.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Push main first, or tag a commit that is on main."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # No cache in a job that can write releases, so nothing cached can sneak in.
          package-manager-cache: false

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version. Push the tag v$version, or fix package.json."
            exit 1
          fi

      # No npm install step: the project has no dependencies.
      - name: Run tests
        run: npm test

      # Also proves the built page carries this version (the build writes it in).
      - name: Check that dist/ matches the sources
        run: npm run build:check

      - name: Take the release notes from CHANGELOG.md
        run: |
          # The lines under "## [<version>] ...", up to the next "## [" heading
          # or the link list at the end of the file.
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, "## [") == 1 { if (on) exit; on = index($0, head) == 1; next }
            /^\[[^ ]+\]: / { if (on) exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no text under a \"## [$version]\" heading. Add the section, then tag again."
            exit 1
          fi

      # Written next to the page, so "sha256sum -c" works in the download folder.
      - name: Write the checksum file
        working-directory: dist
        run: sha256sum claude-export-reader.html > claude-export-reader.html.sha256

      # Signed proof that this workflow built the page from this commit. Anyone can
      # check it with "gh attestation verify" (see "Check the download" in README.md).
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/claude-export-reader.html

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A version with a hyphen (1.1.0-rc.1) is a pre-release, so it never
          # becomes the "latest release" that the README links to.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            dist/claude-export-reader.html \
            dist/claude-export-reader.html.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"
