name: CI

on:
  push:
  pull_request:

# Read-only token: CI only checks out the code and runs local commands.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No npm install step: the project has no dependencies.
      - name: Run tests
        run: npm test

      - name: Check that dist/ matches the sources
        run: npm run build:check
